[project]
name = "trader-bot"
version = "2.0.0"
description = "Production AI Trading Bot with Alpaca Integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core AI Providers (Production Only)
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    
    # Trading Platform
    "alpaca-trade-api>=0.26",
    
    # MCP & Agents Framework
    "mcp>=1.0.0",
    "openai-agents>=0.0.15",
    
    # Core Dependencies
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "httpx>=0.28.1",
    
    # Dashboard & Monitoring
    "gradio>=5.0.0",
    "plotly>=6.0.1",
    
    # Utilities
    "psutil>=7.0.0",
    "setuptools>=78.1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
