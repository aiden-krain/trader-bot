[build]
builder = "heroku/python"

[build.buildCommand]
command = """
# Modern Python buildpack approach - avoids nixpacks numpy issues
pip install --upgrade pip setuptools wheel
pip install -r requirements.txt
"""

[deploy]
startCommand = "cd src && python combined_app.py"
restartPolicyType = "always"
restartPolicyMaxRetries = 10

[environments.production]
variables = { 
  PYTHONPATH = "/app/src",
  PORT = "8080"
}
